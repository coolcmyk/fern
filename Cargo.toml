[package]
name = "fern"
version = "0.1.0"
edition = "2024"
description = "Run robotics simulations on cloud compute"
license = "MIT"
repository = "https://github.com/coolcmyk/fern"

[dependencies]
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
url = "2"

[profile.release]
lto = "thin"
strip = true
